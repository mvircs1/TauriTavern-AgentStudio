<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Studio: página de teste</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <style>
        /* Imitação mínima do tema padrão do SillyTavern. */
        :root {
            --SmartThemeBodyColor: rgb(220, 220, 210);
            --SmartThemeEmColor: rgb(145, 145, 145);
            --SmartThemeQuoteColor: rgb(225, 138, 36);
            --SmartThemeBlurTintColor: rgba(23, 23, 23, 0.92);
            --SmartThemeBorderColor: rgba(0, 0, 0, 0.5);
            --SmartThemeBlurStrength: 10px;
            --mainFontSize: 15px;
            color-scheme: dark;
        }
        body { margin: 0; font-family: system-ui, sans-serif; background: #2b2d31 linear-gradient(135deg, #3a3f4b, #1d1f24); color: var(--SmartThemeBodyColor); min-height: 100vh; }
        .page { max-width: 560px; margin: 0 auto; padding: 16px; }
        .text_pole { background: rgba(0,0,0,0.3); color: inherit; border: 1px solid rgba(255,255,255,0.15); border-radius: 5px; padding: 4px 6px; font: inherit; box-sizing: border-box; width: 100%; }
        .menu_button { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; margin: 4px; border: 1px solid rgba(255,255,255,0.15); border-radius: 5px; background: rgba(0,0,0,0.3); cursor: pointer; color: inherit; font: inherit; }
        .checkbox_label { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
        .inline-drawer-header { display: flex; justify-content: space-between; padding: 6px 0; cursor: pointer; }
        .list-group-item { padding: 8px; cursor: pointer; display: flex; gap: 6px; }
        #extensionsMenu { border: 1px dashed rgba(255,255,255,0.2); border-radius: 6px; margin-bottom: 12px; }
        #toasts { position: fixed; right: 12px; bottom: 12px; z-index: 999999; display: flex; flex-direction: column; gap: 6px; }
        #toasts div { background: #333; padding: 8px 12px; border-radius: 6px; border-left: 4px solid #888; max-width: 320px; }
    </style>
</head>
<body>
    <div class="page">
        <h3>Página de teste do Agent Studio</h3>
        <div id="extensionsMenu"></div>
        <div id="extensions_settings2"></div>
    </div>
    <div id="toasts"></div>

    <script type="module">
        import { createAgentMock, createExtensionStoreMock, createSillyTavernMock, createSkillMock } from './mocks.mjs';

        const st = createSillyTavernMock();
        st.books.set('Lyra Lore', {
            entries: {
                0: { uid: 0, comment: 'Lyra', key: ['Lyra'], keysecondary: [], content: 'Lyra é uma arqueira de Aetheria.', constant: false, disable: false, position: 0, order: 100 },
                1: { uid: 1, comment: 'Aetheria', key: ['Aetheria'], keysecondary: [], content: 'Reino nas nuvens.', constant: false, disable: false, position: 0, order: 100 },
            },
        });
        st.books.set('Chat Book', { entries: {} });

        // Popups simulados: respondem com o valor de window.__nextPrompt (ou o padrão) e confirmam sempre.
        st.context.Popup = {
            show: {
                input: async (title, text, value) => (window.__nextPrompt !== undefined ? window.__nextPrompt : value),
                confirm: async () => 1,
            },
        };
        st.context.POPUP_RESULT = { AFFIRMATIVE: 1, NEGATIVE: 0 };
        // Perfis de Conexão e geração simulados (para o Auto-preencher do mapa).
        const fakePlan = JSON.stringify({
            places: [
                { name: "Aetheria", level: "world", type: "reino", summary: "Reino nas nuvens." },
                { name: "Solenne", level: "region", parent: "Aetheria", type: "cidade", summary: "Capital de pedra branca." },
                { name: "Taverna do Vento", level: "local", parent: "Solenne", type: "taverna", summary: "Barulhenta e quente.", residents: [{ name: "Mira", description: "taverneira" }] },
                { name: "Mercado Alto", level: "local", parent: "Solenne", type: "mercado" },
            ],
            connections: [{ from: "Taverna do Vento", to: "Mercado Alto", description: "rua das lanternas", two_way: true }],
        });
        window.__fillCalls = [];
        st.context.ConnectionManagerRequestService = {
            getSupportedProfiles: () => [{ id: "p1", name: "Gemini Flash", model: "gemini-flash" }],
            sendRequest: async (id, messages, max, options) => { window.__fillCalls.push({ id, messages, max, options }); await new Promise(r => setTimeout(r, 300)); return { content: "Aqui está:" + String.fromCharCode(10) + "`".repeat(3) + "json" + String.fromCharCode(10) + fakePlan + String.fromCharCode(10) + "`".repeat(3) }; },
        };
        st.context.generateRaw = async (input) => { window.__fillCalls.push({ raw: input }); return fakePlan; };
        st.SillyTavern.libs = {};

        const agent = createAgentMock();
        window.SillyTavern = st.SillyTavern;
        const skill = createSkillMock();
        window.__TAURITAVERN__ = { ready: Promise.resolve(), api: { agent: agent.api, extension: { store: createExtensionStoreMock() }, skill } };
        window.__mock = { st, agent, skill };

        const toast = color => (message, title) => {
            const div = document.createElement('div');
            div.style.borderLeftColor = color;
            div.textContent = title ? `${title}: ${message}` : message;
            document.getElementById('toasts').append(div);
            setTimeout(() => div.remove(), 4000);
        };
        window.toastr = { success: toast('#6fbf73'), error: toast('#e05d5d'), warning: toast('#e0a35d'), info: toast('#5d9be0') };

        await import('../index.js');
    </script>
</body>
</html>
